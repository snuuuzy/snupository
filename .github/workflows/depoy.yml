name: Deploy

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ]
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@3
        with:
          package-manager: npm
          node-version: 22

    deploy:
      needs: build
      runs-on: ubuntu-latest
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      steps: 
        - id: deployment
          uses: actions/deploy-pages@v4
